#
# Tối ưu Render Free/Starter — Spring Boot 3 + MongoDB Atlas
# (file này bổ sung / ghi đè application.yml khi cùng key)
#

# --- Spring Cache (in-memory, không cần Redis) ---
spring.cache.type=simple

# --- MongoDB: giới hạn connection pool (tiết kiệm RAM) ---
# maxPoolSize thấp vì Render thường 512MB; tránh mỗi instance mở hàng chục socket tới Atlas
spring.data.mongodb.auto-index-creation=true

# --- Logging Production: tắt debug chi tiết ---
logging.level.root=WARN
logging.level.com.cinema.booking=INFO
logging.level.org.springframework=WARN
logging.level.org.springframework.data.mongodb=WARN
logging.level.org.springframework.data.mongodb.core.MongoTemplate=WARN
logging.level.org.mongodb.driver=WARN
logging.level.org.mongodb.driver.connection=WARN
logging.level.org.mongodb.driver.protocol=WARN
logging.level.org.hibernate=WARN

# --- HTTP / Tomcat nhẹ hơn trên Render ---
server.tomcat.threads.max=50
server.tomcat.accept-count=50
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css

#
# JVM (không đặt trong properties — cấu hình trên Render / Dockerfile):
#   JAVA_OPTS=-Xms128m -Xmx380m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m
#
